name: personal IPTV builder (offline)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/personal_bunny_playlists.py'
      - 'tools/free_hls_filter.py'
      - 'tools/auto_bunny_setup.py'
      - 'tools/sync_bunny_countries.py'
      - 'tools/build_lampa_lite.py'
      - 'tools/lampa_category_fix.py'
      - '.github/workflows/personal-bunny-playlists.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile standalone builder
        run: python3 -m py_compile tools/personal_bunny_playlists.py
      - name: Run offline parser and safety tests
        run: python3 tools/personal_bunny_playlists.py --self-test
      - name: Build from historical snapshot (no publication)
        run: |
          python3 tools/personal_bunny_playlists.py --no-public --output "$RUNNER_TEMP/iptv-personal"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"iptv-personal"; r=json.loads((p/"catalog"/"report.json").read_text()); assert r["historical_adult_entries"] >= 60; assert r["live_streams_tested"] == 0; assert (p/"adult.m3u").read_text().startswith("#EXTM3U"); print("HISTORIC_M3U_BUILD_PASS")'
      - name: Build merged index, categories and Ukraine (no publication)
        run: |
          python3 tools/personal_bunny_playlists.py --output "$RUNNER_TEMP/iptv-complete" --country ua
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"iptv-complete"; r=json.loads((p/"catalog"/"report.json").read_text()); assert r["public_entries"] > 1000; assert r["combined_entries"] > r["public_entries"]; assert (p/"categories"/"xxx.m3u").exists(); assert (p/"countries"/"ua.m3u").exists(); assert (p/"index.m3u").stat().st_size > 100000; print("FULL_M3U_BUILD_PASS")'
      - name: Compile free-only checker
        run: python3 -m py_compile tools/free_hls_filter.py
      - name: Offline free-only checker tests
        run: python3 tools/free_hls_filter.py --self-test
      - name: Compile Bunny one-click installer
        run: python3 -m py_compile tools/auto_bunny_setup.py
      - name: One-click installer mock provisioning and playlist safety tests
        run: python3 tools/auto_bunny_setup.py --self-test
      - name: Compile country mirror generator
        run: python3 -m py_compile tools/sync_bunny_countries.py
      - name: Offline country mirror completeness, group index and preservation
        run: python3 tools/sync_bunny_countries.py
      - name: Download every official country playlist (advisory third-party reliability)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import sync_bunny_countries as sync
          output = Path(os.environ["RUNNER_TEMP"]) / "country-live-acceptance"
          report = sync.create_country_mirror(output, workers=8)
          assert report["country_playlists"] > 100
          assert (output / "countries" / "ua.m3u").read_bytes().startswith(b"#EXTM3U")
          assert (output / "countries" / "us.m3u").read_bytes().startswith(b"#EXTM3U")
          assert (output / "index.country.m3u").read_bytes().startswith(b"#EXTM3U")
          print("OFFICIAL_COUNTRIES_MIRROR_BUILD_PASS", report["country_playlists"])
          PY
      - name: Compile Tizen lightweight playlist builder
        run: python3 -m py_compile tools/build_lampa_lite.py
      - name: Offline Tizen lightweight playlist safety and category balance
        run: python3 tools/build_lampa_lite.py
      - name: Real upstream public catalog to lightweight M3U profiles
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import build_lampa_lite as lite
          public = Path(os.environ["RUNNER_TEMP"]) / "iptv-complete"
          output = Path(os.environ["RUNNER_TEMP"]) / "iptv-tizen"
          before = (public / "index.m3u").read_bytes()
          result = lite.build(public, output)
          assert (public / "index.m3u").read_bytes() == before
          for name, cap in lite.PROFILES:
              stats = result["playlists"][name]
              assert 50 <= stats["entries"] <= cap
              assert stats["adult_entries"] > 0
              assert "XXX" in stats["categories"]
              assert "News" in stats["categories"] or "news" in stats["categories"]
              assert stats["bytes"] < 750_000
              print("TIZEN_LITE_PROFILE_PASS", name, stats["entries"], stats["bytes"])
          PY
      - name: Compile canonical group normalizer
        run: python3 -m py_compile tools/lampa_category_fix.py
      - name: Test composite group splitting and rarity coalescing
        run: python3 tools/lampa_category_fix.py
      - name: Repair groups against official 11k-channel public M3U (no Bunny upload)
        run: |
          python3 - <<'PY'
          import collections
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import lampa_category_fix as fix
          import personal_bunny_playlists as m3u

          source = Path(os.environ["RUNNER_TEMP"]) / "iptv-complete"
          target = Path(os.environ["RUNNER_TEMP"]) / "iptv-category-fix"
          original = (source / "index.m3u").read_bytes()
          report = fix.build(source, target)
          assert (source / "index.m3u").read_bytes() == original
          assert report["source_entries"] > 11000
          full = m3u.parse_m3u((target / "index.category.m3u").read_text())
          source_entries = m3u.parse_m3u(original.decode("utf-8"))
          assert len(full) == len(source_entries)
          assert [u for _, u in full] == [u for _, u in source_entries]
          counts = collections.Counter(m3u.group_names(m)[0] for m, _ in full)
          assert len(counts) <= 30, counts
          assert all(n >= 10 or g == "XXX" for g, n in counts.items()), counts
          assert all(len(m3u.group_names(m)) == 1 and ";" not in m3u.group_names(m)[0] for m, _ in full)
          for name, limit in (("lampa-clean-lite.m3u", 240), ("lampa-clean.m3u", 600)):
              items = m3u.parse_m3u((target / name).read_text())
              grouped = collections.Counter(m3u.group_names(m)[0] for m, _ in items)
              assert len(items) <= limit
              assert "XXX" in grouped
              assert all(n >= 3 or g == "XXX" for g, n in grouped.items()), grouped
              assert all(len(m3u.group_names(m)) == 1 and ";" not in m3u.group_names(m)[0] for m, _ in items)
              print("REAL_LAMPA_GROUPS_PASS", name, len(items), len(grouped), (target / name).stat().st_size)
          print("FULL_LAMPA_GROUPS_PASS", len(full), len(counts))
          PY
