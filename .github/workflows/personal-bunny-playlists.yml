name: personal IPTV builder (offline)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/personal_bunny_playlists.py'
      - '.github/workflows/personal-bunny-playlists.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile standalone builder
        run: python3 -m py_compile tools/personal_bunny_playlists.py
      - name: Run offline parser and safety tests
        run: python3 tools/personal_bunny_playlists.py --self-test
